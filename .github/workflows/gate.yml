# The standing gate (docs/design/morphe.md §13), run through the single entry
# point `scripts/check.sh` so CI and a local build run the identical checks:
# `portable` (fmt; clippy over the workspace and the embedded backends; test;
# doc) and the `coverage` floor. The out-of-band clingo differential and the
# criterion benches are not here — they need the pixi environment (§13).
#
# morphe pins themelios-syntax to a public git revision (crates/morphe/Cargo.toml),
# so cargo fetches the tier during the build — no sibling checkout is needed.
name: gate

# PAUSED pending the October GitHub Actions refresh (the quota is exhausted). The
# workflow is retained as documented intent and runs only on manual dispatch;
# until it resumes, the local gate is the gate — run `scripts/check.sh full`
# before pushing (see CONTRIBUTING.md, "Verification and review").
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out morphe
        uses: actions/checkout@v5
        with:
          path: morphe
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # CI and a local build run the identical gate through this one entry point.
      - name: Portable checks (fmt, clippy, test, doc)
        working-directory: morphe
        run: scripts/check.sh portable
      - name: Coverage floor
        working-directory: morphe
        run: scripts/check.sh coverage
